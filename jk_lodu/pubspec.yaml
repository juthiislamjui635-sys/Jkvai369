name: jk_lodu
description: "JK LODU - Professional Modern Advanced Multiplayer Ludo Game for Android, Web, and iOS."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_bloc: ^8.1.5
  provider: ^6.1.2
  get_it: ^7.6.7
  equatable: ^2.0.5

  # UI & Presentation
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1

  # Game Animation & Engine Support
  flame: ^1.16.0

  # Firebase Core & Services (Free-tier compatible)
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.4
  google_sign_in: ^6.2.1
  cloud_firestore: ^4.17.2
  firebase_database: ^10.5.4
  firebase_storage: ^11.7.4

  # Media, Audio & Haptics
  audioplayers: ^6.0.0
  image_picker: ^1.1.0
  image_cropper: ^5.0.1
  flutter_image_compress: ^2.2.0

  # Utilities & Device
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  crypto: ^3.0.3
  intl: ^0.19.0
  logger: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  mocktail: ^1.0.3
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
