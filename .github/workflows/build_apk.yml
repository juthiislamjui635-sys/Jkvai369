name: Build JK LODU Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Locate Flutter Project Directory
        id: locate_dir
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "project_dir=." >> $GITHUB_OUTPUT
            echo "Target directory is root (.)"
          elif [ -f "jk_lodu/pubspec.yaml" ]; then
            echo "project_dir=jk_lodu" >> $GITHUB_OUTPUT
            echo "Target directory is jk_lodu"
          else
            echo "Error: pubspec.yaml not found in root or jk_lodu!"
            exit 1
          fi

      - name: Ensure Gradle Wrapper Executable
        run: |
          cd ${{ steps.locate_dir.outputs.project_dir }}
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Install Flutter Dependencies
        run: |
          cd ${{ steps.locate_dir.outputs.project_dir }}
          flutter pub get

      - name: Build Release APK
        run: |
          cd ${{ steps.locate_dir.outputs.project_dir }}
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jk-lodu-release-apk
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
            **/build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
